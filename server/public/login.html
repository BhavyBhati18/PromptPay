<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AI Search & Earn</title>
  <link rel="stylesheet" href="auth.css">
  <link rel="icon" type="image/jpeg" href="/querypay_logo.jpg">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="/" class="auth-logo">
          <img src="/querypay_logo.jpg" alt="QueryPay Logo" class="brand-logo-img" style="width: 44px; height: 44px; border-radius: 10px; object-fit: cover; margin-bottom: 0.5rem;">
          <span>AI Search & Earn</span>
        </a>
        <h1>Welcome Back</h1>
        <p>Access your real-time earnings, prompt logs, and payout requests.</p>
        <div class="earning-pill">
          <span>💰</span>
          <span>Active Rate: $0.0003 / prompt</span>
        </div>
      </div>

      <div id="alert-box" class="alert-box" style="display: none;"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="name@domain.com" required autocomplete="email" autofocus>
        </div>

        <div class="form-group">
          <div class="label-row">
            <label for="password">Password</label>
          </div>
          <div class="password-wrapper">
            <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
            <button type="button" class="toggle-password" id="toggle-pw" tabindex="-1" title="Show password">👁️</button>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="submit-btn">
          <span>Log In to Dashboard →</span>
        </button>
      </form>

      <div class="auth-footer">
        <p>Don't have an account yet? <a href="/register.html">Create one for free</a></p>
        <p><a href="/" class="back-link">← Return to Homepage</a></p>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const alertBox = document.getElementById('alert-box');
    const submitBtn = document.getElementById('submit-btn');
    const togglePw = document.getElementById('toggle-pw');
    const passwordInput = document.getElementById('password');

    togglePw.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      togglePw.textContent = isPassword ? '🔒' : '👁️';
    });

    function showAlert(msg, isError = true) {
      alertBox.textContent = msg;
      alertBox.className = isError ? 'alert-box alert-error' : 'alert-box alert-success';
      alertBox.style.display = 'block';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showAlert('Please enter both your email and password.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>Verifying credentials...</span>';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          showAlert('Login successful! Loading your dashboard...', false);

          // If running within Chrome extension environment, sync token & user
          if (window.chrome && chrome.storage && chrome.storage.local) {
            chrome.storage.local.set({
              userId: data.user.id,
              userEmail: data.user.email,
              userName: data.user.name,
              balance: data.user.balance,
              authToken: data.token
            });
          }

          setTimeout(() => {
            window.location.href = '/dashboard.html';
          }, 600);
        } else {
          showAlert(data.error || 'Invalid email or password.');
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Log In to Dashboard →</span>';
        }
      } catch (err) {
        showAlert('Could not connect to server. Please verify the server is running.');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Log In to Dashboard →</span>';
      }
    });

    // If user already has valid session, send straight to dashboard
    (async function checkExisting() {
      try {
        const res = await fetch('/api/auth/me', { credentials: 'include' });
        const data = await res.json();
        if (data.authenticated) {
          window.location.href = '/dashboard.html';
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
